[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "administration-llm"
version = "0.1.0"
description = "Governed natural-language to semantic graph to read-only SQL pilot"
requires-python = ">=3.11"
dependencies = ["networkx>=3.6,<4"]

[project.scripts]
kerala-llm = "kgraph_llm.cli:main"

[tool.setuptools.packages.find]
include = ["kgraph_llm*"]

[tool.setuptools.package-data]
kgraph_llm = ["**/*.sql", "ministries/*/README.md", "ministries/README.md"]
